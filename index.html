/* ---------- crypto for private costs ---------- */
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){var s="",b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function unb64(s){var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function deriveKey(pw,salt){return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);});}
function encryptCosts(pw,obj){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return deriveKey(pw,salt).then(function(key){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(JSON.stringify(obj)));}).then(function(ct){return {salt:b64(salt),iv:b64(iv),ct:b64(ct)};});}
function decryptCosts(pw,sec){return deriveKey(pw,unb64(sec.salt)).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(sec.iv)},key,unb64(sec.ct));}).then(function(pt){return JSON.parse(dec.decode(pt));});}

function markDirty(){admin.dirty=true;var st=document.getElementById("a-status");if(st){st.textContent="Alterações não publicadas";st.className="status dirty";}var pb=document.getElementById("a-publish");if(pb)pb.disabled=false;}
function savePw(pw){try{if(pw)localStorage.setItem("samy-cost-pw",pw);else localStorage.removeItem("samy-cost-pw");}catch(e){}}
function unlockWith(pw,quiet){if(!state.secret){if(!quiet)flash("Crie a senha dos custos na aba Custos.");return Promise.resolve(false);}return decryptCosts(pw,state.secret).then(function(o){admin.pw=pw;admin.costs=o||{};savePw(pw);if(!quiet)admin.msg={text:"Custos desbloqueados.",ok:true};renderAdmin();return true;}).catch(function(){if(!quiet)flash("Senha incorreta.");return false;});}

var ORD_PAY=["Pix","Dinheiro","Cartão","Outro"],WD=["dom","seg","ter","qua","qui","sex","sáb"];
function pad2(n){return (n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function parseYmd(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function mondayOf(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function weekStart(off){var d=mondayOf(new Date());d.setDate(d.getDate()+off*7);return d;}
function dm(s){return s.slice(8,10)+"/"+s.slice(5,7);}
function orders(){if(!admin.costs)return [];if(!Array.isArray(admin.costs._pedidos))admin.costs._pedidos=[];var l=admin.costs._pedidos;l.forEach(function(o){if(typeof o.paid!=="boolean"){o.paid=o.status==="Pago"||o.status==="Entregue";o.deliv=o.status==="Entregue";delete o.status;}if(typeof o.rec!=="number")o.rec=o.paid?o.total:0;o.paid=o.rec>=o.total;});return l;}
function ordOwed(o){return Math.max(0,Math.round((o.total-o.rec)*100)/100);}
function ordForm(){if(!admin.ord.f)admin.ord.f={date:ymd(new Date()),client:"",item:"",qty:"1",total:"",pay:"Pix",paid:false,deliv:false,note:"",auto:true,cost:"",autoCost:true,rec:""};return admin.ord.f;}
function prodByName(n){n=String(n||"").trim().toLowerCase();return n?state.products.find(function(x){return String(x.name).trim().toLowerCase()===n;}):null;}
function ordCost(o){if(typeof o.cost==="number")return o.cost;var p=prodByName(o.item),c=p?cost(p):null;return c==null?null:Math.round(c*o.qty*100)/100;}
function ordProfit(o){var c=ordCost(o);return c==null?null:Math.round((o.total-c)*100)/100;}
function lucroHTML(o){var l=ordProfit(o);return l==null?'<b class="na">—</b>':'<b class="num'+(l<0?" neg":"")+'">'+money(l)+'</b>';}
function opts(list,sel){return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join("");}
function ordWeekList(){var ws=weekStart(admin.ord.week),we=new Date(ws);we.setDate(we.getDate()+6);var a=ymd(ws),b=ymd(we);return orders().filter(function(o){return o.date>=a&&o.date<=b;});}
function ordSumInner(week){
  var tot=0,pend=0,nd=0,luc=0,nl=0,cst=0;
  week.forEach(function(o){tot+=o.total;pend+=ordOwed(o);if(!o.deliv)nd++;var l=ordProfit(o);if(l!=null){luc+=l;cst+=ordCost(o);nl++;}});
  return '<h3>Resumo da semana</h3><div class="sumrow num"><div><b>'+week.length+'</b><span>'+(week.length===1?"pedido":"pedidos")+'</span></div><div><b>'+money(tot)+'</b><span>vendido</span></div><div><b>'+money(cst)+'</b><span>custo total</span></div><div><b style="color:var(--'+(luc<0?"danger":"ok")+')">'+money(luc)+'</b><span>lucro</span></div><div><b>'+money(pend)+'</b><span>falta receber</span></div><div><b>'+nd+'</b><span>falta entregar</span></div></div>'+(nl<week.length?'<p class="hint">'+(week.length-nl)+(week.length-nl===1?' pedido está sem custo e ficou':' pedidos estão sem custo e ficaram')+' fora do custo e do lucro. Preencha o custo no pedido.</p>':'');
}

function resizeImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=function(){rej(new Error("Não foi possível ler a imagem."));};
    fr.onload=function(){var img=new Image();img.onload=function(){var max=640,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);var d=c.toDataURL("image/webp",0.78);if(d.indexOf("data:image/webp")!==0)d=c.toDataURL("image/jpeg",0.8);res(d);};img.onerror=function(){rej(new Error("Arquivo não é uma imagem válida."));};img.src=fr.result;};
    fr.readAsDataURL(file);

function publish(){
  if(admin.busy||!artifactNS)return;
  admin.busy=true;admin.msg=null;renderAdmin();
  var p=admin.costs?encryptCosts(admin.pw,admin.costs).then(function(sec){state.secret=sec;}):Promise.resolve();
  p.then(function(){
    var html=buildHTML();
    if(html.length>15.5*1024*1024)throw {code:"too_large"};
    try{sessionStorage.setItem("samy-pending",JSON.stringify(state));if(admin.pw)sessionStorage.setItem("samy-k",admin.pw);}catch(e){}
    return artifactNS.publish(html);
  }).then(function(){admin.dirty=false;admin.busy=false;flash("Publicado! O site já está atualizado para os clientes.",true);})
  .catch(function(e){
    admin.busy=false;var c=e&&e.code;
    try{if(c!=="conflict"){sessionStorage.removeItem("samy-pending");}}catch(x){}
    var m=c==="conflict"?"Outra versão foi publicada antes. A página vai recarregar; suas edições poderão ser recuperadas.":
      (c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled")?"Esta visualização não tem permissão para publicar. Abra o site logada na sua conta Claude.":
      c==="too_large"?"O site ficou grande demais (muitas fotos ou vídeos). Remova um vídeo de avaliação ou troque fotos por imagens menores.":
      c==="rate_limited"?"Muitas publicações seguidas. Aguarde um minuto e publique de novo.":"Não foi possível publicar agora. Tente de novo em instantes.";
    flash(m,false);
  });
}

function doImport(){
  var lines=admin.imp.split("\n").map(function(l){return l.trim();}).filter(Boolean),added=0,errs=[];
  var hasCost=lines.some(function(l){var p=l.split(/;|\t/);return p[2]&&p[2].trim();});
  if(hasCost&&!admin.costs){flash("A lista tem custos. Desbloqueie (ou crie) a senha na aba Custos antes de importar.");return;}
  lines.forEach(function(l,i){var p=l.split(/;|\t/).map(function(x){return x.trim();});if(!p[0]){errs.push(i+1);return;}
    var np={id:uid()+i,name:p[0],category:p[1]||"Outros",specs:[],price:parseMoney(p[3]),photo:null,active:true};
    var c=parseMoney(p[2]);if(c!=null&&admin.costs)admin.costs[np.id]=c;state.products.push(np);added++;});
  admin.imp="";markDirty();admin.msg={text:added+" produto(s) importado(s)"+(errs.length?". Linhas ignoradas: "+errs.join(", "):"")+".",ok:true};refreshAll();
}
function applyMargin(){
  var m=parseMoney(admin.margin);if(m==null){flash("Informe a margem em %.");return;}
  var n=0;state.products.forEach(function(p){var c=cost(p);if(c==null)return;if(admin.onlyEmpty&&typeof p.price==="number")return;var v=c*(1+m/100);p.price=admin.round?ceil90(v):Math.round(v*100)/100;n++;});
  if(!n){flash("Nenhum produto com custo"+(admin.onlyEmpty?" e sem preço":"")+" para calcular.");return;}
  markDirty();admin.msg={text:"Preço calculado em "+n+" produto(s). Confira e publique.",ok:true};refreshAll();
}
